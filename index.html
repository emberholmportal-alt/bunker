<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REFUGIO 404 — LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="motion">
  <div id="app"></div><div id="flash"></div><div id="madness"></div>
  <div id="alert"></div>
  <div id="camhud">
    <div class="ch-tl"><span class="ch-rec" data-i18n="ov_rec">● REC</span><span id="ch-cam">CAM 01 — OBSERVATORY</span></div>
    <div class="ch-tr"><span id="ch-time">00:00:00</span><span class="ch-day"><span data-i18n="ov_day">DAY</span> <b id="ch-day">0</b></span><span class="ch-bee-line"><span class="ch-bee">✦</span> <span data-i18n="ov_bees">BEES RELEASED</span> <b id="ch-bees">0</b></span></div>
    <div class="ch-br"><span class="ch-bars"><i></i><i></i><i></i><i></i></span><span id="ch-sig" data-i18n="ov_live">LIVE</span></div>
  </div>

  <div id="panel">
    <div class="prow">
      <div class="seg" data-i18n-title="tt_speed" title="Stream speed"><button class="btn on" data-spd="1">x1</button><button class="btn" data-spd="800">x800</button><button class="btn" data-spd="6000">x6k</button></div>
    </div>
    <div class="prow"><button class="btn on" id="cel" data-i18n="btn_style_cel" data-i18n-title="tt_style" title="Cel-shading / realistic style">STYLE: CEL</button><button class="btn" id="snd" data-i18n="btn_sound" data-i18n-title="tt_sound" title="Audio on/off (hum, alarms, radio)">♪ SOUND</button><button class="btn" id="reset" data-i18n="btn_restart" data-i18n-title="tt_reset" title="Restart the stream">RESTART</button></div>
  </div>

  <div id="map"><canvas id="mapc" width="196" height="150"></canvas></div>

  <div id="boot"><h2 data-i18n="boot_title">OPENING SHELTER</h2><p class="blink" data-i18n="boot_sub">sealing hatches…</p></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/RGBShiftShader.js"></script>
<script src="vendor/VignetteShader.js"></script>
<script src="vendor/FilmShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script src="js/config.js"></script>
<script src="js/stream.js"></script>
<script src="js/i18n.js"></script>
<script src="js/textures.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/hud.js"></script>
<script src="js/game.js"></script>
</body>
</html>
